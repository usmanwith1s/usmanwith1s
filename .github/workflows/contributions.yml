name: Generate Contribution 3D

"on":
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-contribution-3d:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          username = "usmanwith1s"

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      contributionLevel
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {__import__('os').environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "usmanwith1s-contribution-generator"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode("utf-8"))

          if "errors" in result:
              raise RuntimeError(
                  "GitHub GraphQL error: "
                  + json.dumps(result["errors"])
              )

          user = result.get("data", {}).get("user")

          if not user:
              raise RuntimeError(
                  f"Could not find GitHub user: {username}"
              )

          calendar = user["contributionsCollection"]["contributionCalendar"]

          total = calendar["totalContributions"]

          values = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  values.append((
                      day["date"],
                      day["contributionCount"],
                      day["contributionLevel"]
                  ))

          # Keep the latest 365 days.
          values = values[-365:]

          if not values:
              raise RuntimeError(
                  "GitHub returned no contribution data."
              )

          print(
              f"Found {len(values)} contribution days."
          )

          print(
              f"Total contributions: {total}"
          )

          width = 1200
          height = 620

          cols = 53
          rows = 7

          cell_w = 17
          cell_d = 9

          base_x = 180
          base_y = 420

          max_height = 110

          def project(col, row, height):
              x = base_x + (col - row) * cell_w
              y = base_y + (col + row) * cell_d - height
              return x, y

          def level_height(level):
              return {
                  "NONE": 2,
                  "FIRST_QUARTILE": 18,
                  "SECOND_QUARTILE": 40,
                  "THIRD_QUARTILE": 68,
                  "FOURTH_QUARTILE": 100
              }.get(level, 2)

          def level_color(level):
              return {
                  "NONE": "#161616",
                  "FIRST_QUARTILE": "#365f12",
                  "SECOND_QUARTILE": "#5f941b",
                  "THIRD_QUARTILE": "#82c72a",
                  "FOURTH_QUARTILE": "#9cff00"
              }.get(level, "#161616")

          svg = f'''<svg width="{width}" height="{height}"
          viewBox="0 0 {width} {height}"
          xmlns="http://www.w3.org/2000/svg">

          <rect width="{width}" height="{height}" rx="28"
                fill="#0b0b0b"
                stroke="#252525"
                stroke-width="2"/>

          <rect width="{width}" height="62" rx="28"
                fill="#111111"/>

          <rect y="38" width="{width}" height="24"
                fill="#111111"/>

          <circle cx="30" cy="31" r="7" fill="#ff5f56"/>
          <circle cx="54" cy="31" r="7" fill="#ffbd2e"/>
          <circle cx="78" cy="31" r="7" fill="#27c93f"/>

          <text x="600" y="38"
                text-anchor="middle"
                fill="#777777"
                font-family="monospace"
                font-size="15">
              ~/ contributions --3d
          </text>

          <text x="50" y="112"
                fill="#9cff00"
                font-family="monospace"
                font-size="17">
              usman@github:~$
          </text>

          <text x="215" y="112"
                fill="#ffffff"
                font-family="monospace"
                font-size="17">
              git activity --visualize
          </text>

          <text x="50" y="158"
                fill="#ffffff"
                font-family="Arial, sans-serif"
                font-size="30"
                font-weight="700">
              Contribution Activity
          </text>

          <text x="50" y="188"
                fill="#777777"
                font-family="monospace"
                font-size="13">
              REAL GITHUB CONTRIBUTIONS · LAST 365 DAYS
          </text>
          '''

          # Ground grid.
          for col in range(cols + 1):
              x1, y1 = project(col, 0, 0)
              x2, y2 = project(col, rows, 0)

              svg += f'''
              <line x1="{x1:.1f}" y1="{y1:.1f}"
                    x2="{x2:.1f}" y2="{y2:.1f}"
                    stroke="#202020"
                    stroke-width="1"/>
              '''

          for row in range(rows + 1):
              x1, y1 = project(0, row, 0)
              x2, y2 = project(cols, row, 0)

              svg += f'''
              <line x1="{x1:.1f}" y1="{y1:.1f}"
                    x2="{x2:.1f}" y2="{y2:.1f}"
                    stroke="#202020"
                    stroke-width="1"/>
              '''

          # Contribution blocks.
          for index, (date, count, level) in enumerate(values):

              col = index // rows
              row = index % rows

              height_value = level_height(level)

              x, y = project(
                  col,
                  row,
                  height_value
              )

              fill = level_color(level)

              # Front face.
              svg += f'''
              <polygon points="
                  {x:.1f},{y:.1f}
                  {x + cell_w:.1f},{y - cell_d:.1f}
                  {x + cell_w:.1f},{y + max_height / 4:.1f}
                  {x:.1f},{y + max_height / 4 + cell_d:.1f}
              "
              fill="{fill}"
              opacity="0.95"/>
              '''

              # Top face.
              svg += f'''
              <polygon points="
                  {x:.1f},{y:.1f}
                  {x + cell_w:.1f},{y - cell_d:.1f}
                  {x + cell_w / 2:.1f},{y - cell_d * 2:.1f}
                  {x - cell_w / 2:.1f},{y - cell_d:.1f}
              "
              fill="{fill}"
              opacity="0.75"/>
              '''

          svg += f'''
          <text x="600" y="545"
                text-anchor="middle"
                fill="#777777"
                font-family="monospace"
                font-size="13">
              {total} contributions · sourced directly from GitHub
          </text>

          </svg>
          '''

          output = Path(
              "assets/contributions-3d.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"Generated {output} from "
              f"{len(values)} real contribution days."
          )
          PY

      - name: Commit contribution visualization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions-3d.svg

          git diff --cached --quiet || \
            git commit -m "Update contribution 3D visualization"

          git push
