name: Generate Contribution 3D

"on":
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-contribution-3d:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          username = "usmanwith1s"

          # =========================================================
          # GET REAL GITHUB CONTRIBUTION DATA
          # =========================================================

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      contributionLevel
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "usmanwith1s-contribution-generator"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          if "errors" in result:
              raise RuntimeError(
                  "GitHub GraphQL error: "
                  + json.dumps(result["errors"])
              )

          user = result.get("data", {}).get("user")

          if not user:
              raise RuntimeError(
                  f"Could not find GitHub user: {username}"
              )

          calendar = (
              user["contributionsCollection"]
              ["contributionCalendar"]
          )

          weeks = calendar["weeks"]

          if not weeks:
              raise RuntimeError(
                  "GitHub returned no contribution weeks."
              )

          # =========================================================
          # FLATTEN REAL CONTRIBUTION DATA
          # =========================================================

          all_days = []

          for week in weeks:
              for day in week["contributionDays"]:
                  all_days.append({
                      "date": day["date"],
                      "count": day["contributionCount"],
                      "level": day["contributionLevel"]
                  })

          # Latest 365 days.
          days = all_days[-365:]

          if not days:
              raise RuntimeError(
                  "GitHub returned no contribution days."
              )

          # =========================================================
          # REAL STATISTICS
          # =========================================================

          total_contributions = sum(
              day["count"]
              for day in days
          )

          highest_day = max(
              day["count"]
              for day in days
          )

          average_per_day = (
              total_contributions / len(days)
          )

          # Current streak.
          current_streak = 0

          for day in reversed(days):
              if day["count"] > 0:
                  current_streak += 1
              else:
                  break

          print("========================================")
          print("REAL GITHUB CONTRIBUTION DATA")
          print("========================================")
          print(f"Days: {len(days)}")
          print(f"Total: {total_contributions}")
          print(f"Current streak: {current_streak}")
          print(f"Highest day: {highest_day}")
          print(f"Average per day: {average_per_day:.1f}")
          print("========================================")

          # =========================================================
          # SVG SETTINGS
          # =========================================================

          width = 1200
          height = 620

          cols = len(weeks)
          rows = 7

          # Calendar geometry.
          cell_w = 16
          cell_depth_x = 7
          cell_depth_y = 5

          base_x = 145
          base_y = 350

          block_width = 13
          block_depth = 8

          # =========================================================
          # CONTRIBUTION HEIGHT
          # =========================================================

          def level_height(level):
              return {
                  "NONE": 3,
                  "FIRST_QUARTILE": 18,
                  "SECOND_QUARTILE": 38,
                  "THIRD_QUARTILE": 65,
                  "FOURTH_QUARTILE": 95
              }.get(level, 3)

          # =========================================================
          # CONTRIBUTION COLOR
          # =========================================================

          def level_color(level):
              return {
                  "NONE": "#151515",
                  "FIRST_QUARTILE": "#28520d",
                  "SECOND_QUARTILE": "#4f8515",
                  "THIRD_QUARTILE": "#72b51e",
                  "FOURTH_QUARTILE": "#9cff00"
              }.get(level, "#151515")

          # =========================================================
          # 3D PROJECTION
          # =========================================================

          def project(col, row, height_value=0):

              x = (
                  base_x
                  + col * cell_w
                  - row * cell_depth_x
              )

              y = (
                  base_y
                  + col * cell_depth_y
                  + row * cell_depth_y
                  - height_value
              )

              return x, y

          # =========================================================
          # SVG HEADER
          # =========================================================

          svg = f'''<svg width="{width}" height="{height}"
          viewBox="0 0 {width} {height}"
          xmlns="http://www.w3.org/2000/svg">

          <rect width="{width}" height="{height}" rx="28"
                fill="#0b0b0b"
                stroke="#252525"
                stroke-width="2"/>

          <rect width="{width}" height="62" rx="28"
                fill="#111111"/>

          <rect y="38" width="{width}" height="24"
                fill="#111111"/>

          <circle cx="30" cy="31" r="7" fill="#ff5f56"/>
          <circle cx="54" cy="31" r="7" fill="#ffbd2e"/>
          <circle cx="78" cy="31" r="7" fill="#27c93f"/>

          <text x="600" y="38"
                text-anchor="middle"
                fill="#777777"
                font-family="monospace"
                font-size="15">
              ~/ contributions --3d
          </text>

          <!-- LEFT HEADER -->

          <text x="32" y="105"
                fill="#9cff00"
                font-family="monospace"
                font-size="16">
              usman@github:~$
          </text>

          <text x="195" y="105"
                fill="#ffffff"
                font-family="monospace"
                font-size="16">
              git activity --visualize
          </text>

          <text x="32" y="148"
                fill="#ffffff"
                font-family="Arial, sans-serif"
                font-size="29"
                font-weight="700">
              Contribution Activity
          </text>

          <text x="32" y="177"
                fill="#777777"
                font-family="monospace"
                font-size="12">
              REAL GITHUB CONTRIBUTIONS · LAST 365 DAYS
          </text>

          <!-- =====================================================
               RIGHT STATISTICS
               ===================================================== -->

          <text x="810" y="103"
                fill="#4285f4"
                font-family="Arial, sans-serif"
                font-size="16"
                font-weight="700">
              Commit streaks
          </text>

          <text x="810" y="126"
                fill="#ffffff"
                font-family="Arial, sans-serif"
                font-size="15">
              {current_streak} commit streak
          </text>

          <text x="810" y="157"
                fill="#4285f4"
                font-family="Arial, sans-serif"
                font-size="16"
                font-weight="700">
              Commits per day
          </text>

          <text x="810" y="180"
                fill="#ffffff"
                font-family="Arial, sans-serif"
                font-size="15">
              Highest in a day at {highest_day}
          </text>

          <text x="810" y="203"
                fill="#ffffff"
                font-family="Arial, sans-serif"
                font-size="15">
              Average per day at ~{average_per_day:.1f}
          </text>
          '''

          # =========================================================
          # CALENDAR PLANE
          # =========================================================

          for col in range(cols):
              for row in range(rows):

                  x, y = project(
                      col,
                      row,
                      0
                  )

                  x2 = x + cell_w
                  y2 = y + cell_depth_y

                  x3 = (
                      x
                      + cell_w
                      - cell_depth_x
                  )

                  y3 = (
                      y
                      + cell_depth_y * 2
                  )

                  x4 = x - cell_depth_x
                  y4 = y + cell_depth_y

                  svg += f'''
                  <polygon points="
                      {x:.1f},{y:.1f}
                      {x2:.1f},{y2:.1f}
                      {x3:.1f},{y3:.1f}
                      {x4:.1f},{y4:.1f}
                  "
                  fill="#151515"
                  stroke="#202020"
                  stroke-width="1"/>
                  '''

          # =========================================================
          # CONTRIBUTION BLOCKS
          # =========================================================

          first_index = (
              len(weeks) * 7
              - len(days)
          )

          for index, day in enumerate(days):

              original_index = (
                  first_index + index
              )

              col = original_index // 7
              row = original_index % 7

              level = day["level"]

              height_value = level_height(
                  level
              )

              x, y = project(
                  col,
                  row,
                  height_value
              )

              fill = level_color(
                  level
              )

              w = block_width
              d = block_depth

              # Front face.
              svg += f'''
              <polygon points="
                  {x:.1f},{y:.1f}
                  {x + w:.1f},{y + 3:.1f}
                  {x + w:.1f},{y + height_value:.1f}
                  {x:.1f},{y + height_value - 3:.1f}
              "
              fill="{fill}"/>
              '''

              # Right face.
              svg += f'''
              <polygon points="
                  {x + w:.1f},{y + 3:.1f}
                  {x + w + d:.1f},{y - 2:.1f}
                  {x + w + d:.1f},{y + height_value - 8:.1f}
                  {x + w:.1f},{y + height_value:.1f}
              "
              fill="{fill}"
              opacity="0.72"/>
              '''

              # Top face.
              svg += f'''
              <polygon points="
                  {x:.1f},{y:.1f}
                  {x + w:.1f},{y + 3:.1f}
                  {x + w + d:.1f},{y - 2:.1f}
                  {x + d:.1f},{y - 5:.1f}
              "
              fill="{fill}"
              opacity="0.9"/>
              '''

          # =========================================================
          # FOOTER
          # =========================================================

          svg += f'''
          <text x="600" y="535"
                text-anchor="middle"
                fill="#777777"
                font-family="monospace"
                font-size="13">
              {total_contributions} contributions · sourced directly from GitHub
          </text>

          <text x="600" y="563"
                text-anchor="middle"
                fill="#555555"
                font-family="monospace"
                font-size="11">
              LESS
          </text>

          <rect x="545" y="553"
                width="12" height="12"
                fill="#151515"/>

          <rect x="563" y="553"
                width="12" height="12"
                fill="#28520d"/>

          <rect x="581" y="553"
                width="12" height="12"
                fill="#4f8515"/>

          <rect x="599" y="553"
                width="12" height="12"
                fill="#72b51e"/>

          <rect x="617" y="553"
                width="12" height="12"
                fill="#9cff00"/>

          <text x="640" y="563"
                fill="#555555"
                font-family="monospace"
                font-size="11">
              MORE
          </text>

          </svg>
          '''

          # =========================================================
          # SAVE
          # =========================================================

          output = Path(
              "assets/contributions-3d.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"Generated {output}"
          )

          PY

      - name: Commit contribution visualization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions-3d.svg

          git diff --cached --quiet || \
            git commit -m "Update contribution 3D visualization"

          git push
