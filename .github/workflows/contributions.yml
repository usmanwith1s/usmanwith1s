name: Generate Contribution 3D

"on":
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-contribution-3d:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          username = "usmanwith1s"

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      contributionLevel
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "usmanwith1s-contribution-generator"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode("utf-8"))

          if "errors" in result:
              raise RuntimeError(
                  "GitHub GraphQL error: "
                  + json.dumps(result["errors"])
              )

          user = result.get("data", {}).get("user")

          if not user:
              raise RuntimeError(
                  f"Could not find GitHub user: {username}"
              )

          calendar = user["contributionsCollection"]["contributionCalendar"]

          total = calendar["totalContributions"]

          # Keep GitHub's real calendar structure.
          weeks = calendar["weeks"]

          if not weeks:
              raise RuntimeError(
                  "GitHub returned no contribution weeks."
              )

          print(f"Found {len(weeks)} weeks.")
          print(f"Total contributions: {total}")

          width = 1200
          height = 620

          # ---------------------------------------------------------
          # 3D CALENDAR GEOMETRY
          # ---------------------------------------------------------

          cols = len(weeks)
          rows = 7

          cell_w = 16
          cell_depth_x = 7
          cell_depth_y = 5

          base_x = 145
          base_y = 330

          block_width = 13
          block_depth = 8

          # Height of contribution towers.
          def level_height(level):
              return {
                  "NONE": 3,
                  "FIRST_QUARTILE": 18,
                  "SECOND_QUARTILE": 38,
                  "THIRD_QUARTILE": 65,
                  "FOURTH_QUARTILE": 95
              }.get(level, 3)

          def level_color(level):
              return {
                  "NONE": "#151515",
                  "FIRST_QUARTILE": "#28520d",
                  "SECOND_QUARTILE": "#4f8515",
                  "THIRD_QUARTILE": "#72b51e",
                  "FOURTH_QUARTILE": "#9cff00"
              }.get(level, "#151515")

          # ---------------------------------------------------------
          # ISOMETRIC PROJECTION
          # ---------------------------------------------------------

          def project(col, row, height=0):
              x = (
                  base_x
                  + col * cell_w
                  - row * cell_depth_x
              )

              y = (
                  base_y
                  + col * cell_depth_y
                  + row * cell_depth_y
                  - height
              )

              return x, y

          # ---------------------------------------------------------
          # SVG START
          # ---------------------------------------------------------

          svg = f'''<svg width="{width}" height="{height}"
          viewBox="0 0 {width} {height}"
          xmlns="http://www.w3.org/2000/svg">

          <rect width="{width}" height="{height}" rx="28"
                fill="#0b0b0b"
                stroke="#252525"
                stroke-width="2"/>

          <rect width="{width}" height="62" rx="28"
                fill="#111111"/>

          <rect y="38" width="{width}" height="24"
                fill="#111111"/>

          <circle cx="30" cy="31" r="7" fill="#ff5f56"/>
          <circle cx="54" cy="31" r="7" fill="#ffbd2e"/>
          <circle cx="78" cy="31" r="7" fill="#27c93f"/>

          <text x="600" y="38"
                text-anchor="middle"
                fill="#777777"
                font-family="monospace"
                font-size="15">
              ~/ contributions --3d
          </text>

          <text x="32" y="112"
                fill="#9cff00"
                font-family="monospace"
                font-size="17">
              usman@github:~$
          </text>

          <text x="195" y="112"
                fill="#ffffff"
                font-family="monospace"
                font-size="17">
              git activity --visualize
          </text>

          <text x="32" y="158"
                fill="#ffffff"
                font-family="Arial, sans-serif"
                font-size="30"
                font-weight="700">
              Contribution Activity
          </text>

          <text x="32" y="188"
                fill="#777777"
                font-family="monospace"
                font-size="13">
              REAL GITHUB CONTRIBUTIONS · LAST 365 DAYS
          </text>
          '''

          # ---------------------------------------------------------
          # CALENDAR PLANE
          # ---------------------------------------------------------

          # Draw the entire 53-week × 7-day plane first.
          for col in range(cols):
              for row in range(rows):

                  x, y = project(col, row, 0)

                  x2 = x + cell_w
                  y2 = y + cell_depth_y

                  x3 = x + cell_w - cell_depth_x
                  y3 = y + cell_depth_y * 2

                  x4 = x - cell_depth_x
                  y4 = y + cell_depth_y

                  svg += f'''
                  <polygon points="
                      {x:.1f},{y:.1f}
                      {x2:.1f},{y2:.1f}
                      {x3:.1f},{y3:.1f}
                      {x4:.1f},{y4:.1f}
                  "
                  fill="#151515"
                  stroke="#202020"
                  stroke-width="1"/>
                  '''

          # ---------------------------------------------------------
          # CONTRIBUTION BLOCKS
          # ---------------------------------------------------------

          for col, week in enumerate(weeks):

              for row, day in enumerate(
                  week["contributionDays"]
              ):

                  level = day["contributionLevel"]
                  count = day["contributionCount"]

                  height_value = level_height(level)

                  x, y = project(
                      col,
                      row,
                      height_value
                  )

                  fill = level_color(level)

                  # Width of visible cube.
                  w = block_width
                  d = block_depth

                  # -------------------------------------------------
                  # FRONT FACE
                  # -------------------------------------------------

                  front = f'''
                  <polygon points="
                      {x:.1f},{y:.1f}
                      {x + w:.1f},{y + 3:.1f}
                      {x + w:.1f},{y + height_value:.1f}
                      {x:.1f},{y + height_value - 3:.1f}
                  "
                  fill="{fill}"/>
                  '''

                  # -------------------------------------------------
                  # RIGHT FACE
                  # -------------------------------------------------

                  right = f'''
                  <polygon points="
                      {x + w:.1f},{y + 3:.1f}
                      {x + w + d:.1f},{y - 2:.1f}
                      {x + w + d:.1f},{y + height_value - 8:.1f}
                      {x + w:.1f},{y + height_value:.1f}
                  "
                  fill="{fill}"
                  opacity="0.72"/>
                  '''

                  # -------------------------------------------------
                  # TOP FACE
                  # -------------------------------------------------

                  top = f'''
                  <polygon points="
                      {x:.1f},{y:.1f}
                      {x + w:.1f},{y + 3:.1f}
                      {x + w + d:.1f},{y - 2:.1f}
                      {x + d:.1f},{y - 5:.1f}
                  "
                  fill="{fill}"
                  opacity="0.9"/>
                  '''

                  svg += front
                  svg += right
                  svg += top

          # ---------------------------------------------------------
          # LEGEND / FOOTER
          # ---------------------------------------------------------

          legend_y = 505

          svg += f'''
          <text x="600" y="{legend_y}"
                text-anchor="middle"
                fill="#777777"
                font-family="monospace"
                font-size="13">
              {total} contributions · sourced directly from GitHub
          </text>

          <text x="600" y="{legend_y + 28}"
                text-anchor="middle"
                fill="#555555"
                font-family="monospace"
                font-size="11">
              LESS
          </text>

          <rect x="545" y="{legend_y + 18}"
                width="12" height="12"
                fill="#151515"/>

          <rect x="563" y="{legend_y + 18}"
                width="12" height="12"
                fill="#28520d"/>

          <rect x="581" y="{legend_y + 18}"
                width="12" height="12"
                fill="#4f8515"/>

          <rect x="599" y="{legend_y + 18}"
                width="12" height="12"
                fill="#72b51e"/>

          <rect x="617" y="{legend_y + 18}"
                width="12" height="12"
                fill="#9cff00"/>

          <text x="640" y="{legend_y + 28}"
                fill="#555555"
                font-family="monospace"
                font-size="11">
              MORE
          </text>

          </svg>
          '''

          # ---------------------------------------------------------
          # WRITE FILE
          # ---------------------------------------------------------

          output = Path(
              "assets/contributions-3d.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"Generated {output} from "
              f"{len(weeks)} real GitHub weeks."
          )
          PY

      - name: Commit contribution visualization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions-3d.svg

          git diff --cached --quiet || \
            git commit -m "Update contribution 3D visualization"

          git push
